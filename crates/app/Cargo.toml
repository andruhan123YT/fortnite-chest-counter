[package]
name = "fortnite-chest-counter"
description = "Counts the Fortnite chests you open and break, straight from your replays."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fortnite-chest-counter"
path = "src/main.rs"

[dependencies]
fnreplay.workspace = true
chests.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "0.38"
egui_extras = { version = "0.37", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
# Update checks against GitHub releases and checksum of the download.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
rfd = "0.18"
winreg = "0.56"
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
embed-resource = "3"
