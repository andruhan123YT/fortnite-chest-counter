name: Release

# Push a tag like v1.0.0 to build the exe, its checksum and the zip and attach them to
# that release. Installed apps find it through the latest release and update from the exe
# and the .sha256, so keep those file names. The tag must match the version in Cargo.toml.
on:
  push:
    tags: ["v*"]

# Actions are pinned to commit hashes: this job can write releases, and installed apps
# update from them. Bump the hashes by hand when GitHub retires a Node version.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace
      - name: Tag matches the version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - run: python tools/package.py
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/fortnite-chest-counter.exe dist/fortnite-chest-counter.exe.sha256 dist/*.zip)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
