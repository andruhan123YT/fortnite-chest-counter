[workspace]
resolver = "2"
members = ["crates/fnreplay", "crates/chests", "crates/app"]
default-members = ["crates/fnreplay", "crates/chests", "crates/app"]

[workspace.package]
version = "1.1.2"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.92"
publish = false

[workspace.dependencies]
fnreplay = { path = "crates/fnreplay" }
chests = { path = "crates/chests" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
